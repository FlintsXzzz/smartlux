; PlatformIO - SMARTLUX v2 (ESP32 DevKit)
; Build : pio run -d firmware/SMARTLUX
; Upload: pio run -d firmware/SMARTLUX -t upload
; Serial: pio device monitor -d firmware/SMARTLUX -b 115200
;
; Empat env dipakai CI untuk memastikan opsi opt-in (MQTT/OTA) tidak saling
; merusak dan masih muat flash. Env `esp32dev` adalah build dasar: tidak ada
; SMARTLUX_ENABLE_MQTT / SMARTLUX_OTA_PASS, jadi byte-for-byte sama seperti
; sebelum R6. Alamat 192.0.2.10 adalah TEST-NET-1 (dokumentasi, tidak routable)
; hanya untuk uji kompilasi — ganti lewat secrets.h untuk pemakaian nyata.

[platformio]
; Sketch Arduino hidup di akar proyek, bukan di folder src/ bawaan.
src_dir = .

[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; UART0 dipakai untuk CSV pengukuran (115200 baud).
monitor_filters = default

lib_deps =
  adafruit/Adafruit SSD1306@2.5.17
  adafruit/Adafruit GFX Library@1.13.0
  adafruit/Adafruit INA219@1.2.3
  adafruit/Adafruit BusIO@1.17.4
  knolleary/PubSubClient@2.8

[env:esp32dev]
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp32dev-mqtt]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSMARTLUX_ENABLE_MQTT
  -DMQTT_BROKER='"192.0.2.10"'

[env:esp32dev-ota]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSMARTLUX_OTA_PASS='"ci-ota-password"'

[env:esp32dev-mqtt-ota]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSMARTLUX_ENABLE_MQTT
  -DMQTT_BROKER='"192.0.2.10"'
  -DSMARTLUX_OTA_PASS='"ci-ota-password"'
