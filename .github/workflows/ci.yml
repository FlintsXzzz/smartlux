name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware build (ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Guard PROGMEM pages (budgets + ino2cpp indentation)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys
          src = open("firmware/SMARTLUX/SMARTLUX.ino", encoding="utf-8").read()
          budgets = {"INDEX_HTML": 8192, "CHART_HTML": 4096}
          for name, budget in budgets.items():
              m = re.search(re.escape(name) + r'\[\][^=]*=\s*R"rawliteral\((.*?)\)rawliteral"', src, re.S)
              if not m:
                  sys.exit(f"{name} raw literal not found")
              size = len(m.group(1).encode("utf-8"))
              print(f"{name} = {size} bytes (budget {budget})")
              if size > budget:
                  sys.exit(f"{name} exceeds the {budget} byte PROGMEM budget")
          # Exactly two raw literals: INDEX_HTML and CHART_HTML. The MQTT
          # discovery/config strings use R"json(...)json" instead, so a third
          # raw literal here means an accidental dashboard payload or a lost
          # R"rawliteral -> R"json conversion.
          literals = src.count('R"rawliteral(')
          if literals != 2:
              sys.exit(f"expected exactly 2 R\"rawliteral( payloads, found {literals}")
          bad = [(i, l) for i, l in enumerate(src.splitlines(), 1)
                 if re.match(r'^(async\s+)?function\s', l)]
          if bad:
              for i, l in bad:
                  print(f"::error file=firmware/SMARTLUX/SMARTLUX.ino,line={i}::"
                        f"JS '{l.strip()}' at column 0 is mistaken for a C++ "
                        f"prototype by ino2cpp; indent it one space")
              sys.exit("Indent JS function lines one space for ino2cpp")
          print("ino2cpp guard OK: no JS function lines at column 0")
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/SMARTLUX/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware (four opt-in combinations)
        run: |
          set -euo pipefail
          for env in esp32dev esp32dev-mqtt esp32dev-ota esp32dev-mqtt-ota; do
            echo "::group::pio run -e ${env}"
            pio run -d firmware/SMARTLUX -e "${env}" 2>&1 | tee "/tmp/${env}-build.log"
            echo "::endgroup::"
            python3 - "${env}" "/tmp/${env}-build.log" <<'PY'
          import re, sys
          env, log = sys.argv[1], sys.argv[2]
          text = open(log, encoding="utf-8", errors="replace").read()
          m = re.search(r"Flash:\s*\[[^\]]*\]\s*[\d.]+%\s*\(used (\d+) bytes from (\d+) bytes\)", text)
          if not m:
              sys.exit(f"{env}: could not parse flash usage from build log")
          used, total = int(m.group(1)), int(m.group(2))
          ceiling = 1179648  # 90% of 1310720 bytes (ESP32 DevKit flash)
          if total != 1310720:
              ceiling = int(total * 0.90)
          print(f"{env}: {used} / {total} bytes ({used / total:.1%}), ceiling {ceiling}")
          if used > ceiling:
              sys.exit(f"{env}: flash {used} exceeds the 90% ceiling {ceiling}")
          # Base build: MQTT glue is compiled out. 1036623 is the post-Tier-1
          # baseline; a jump >100 B means an opt-in feature leaked into base.
          baseline = 1036623
          if env == "esp32dev" and used > baseline + 100:
              sys.exit(f"base firmware grew by {used - baseline} bytes (> 100)")
          PY
          done

  native-tests:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles('tests/native/platformio.ini') }}
          restore-keys: |
            pio-native-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run native unit tests
        run: pio test -d tests/native -e native

  repo-tests:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run repo invariant tests
        run: node --test tests/repo/*.test.js
