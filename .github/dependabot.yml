version: 2
updates:
  # Keep GitHub Actions used by the CI workflow current.
  # PlatformIO/Arduino dependencies are pinned in platformio.ini and are not
  # scanned here; bump them deliberately when the firmware is re-verified.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
