; Host-native unit tests for the pure logic that the firmware also uses.
; The same firmware/SMARTLUX/logic.h compiles here on the host, so these tests
; cover the real rules without a board.
;
; Run: pio test -d tests/native -e native
[env:native]
platform = native
test_framework = unity
build_flags =
  -I$PROJECT_DIR/../../firmware/SMARTLUX
  -DUNITY_INCLUDE_DOUBLE
lib_deps =
  throwtheswitch/Unity@^2.6.0
